name: OriginClean Cross-Platform Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-tests:
    name: Pre-Release Verification (Frontend + Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm install
      - run: npm run test
      - run: npm run build
      - run: |
          pip install pytest
          pytest -v backend/tests/test_originclean_backend.py

  build-desktop:
    needs: verify-tests
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
            os_label: "Windows (x64 Setup.exe & .msi)"
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            os_label: "macOS Apple Silicon (ARM64 .dmg & .app)"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            os_label: "macOS Intel (x64 .dmg & .app)"
          - platform: "ubuntu-22.04"
            args: ""
            os_label: "Linux (.AppImage, .deb, .rpm)"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bundle standalone Python backend executable (PyInstaller)
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --onefile --name originclean-backend --paths service/scripts --paths . backend/service/app_server.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies & build
        run: |
          npm install
          npm run build

      - name: Build and Package OriginClean with Tauri Bundler
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name || 'v1.0.0' }}
          releaseName: "OriginClean ${{ github.ref_name || 'v1.0.0' }}"
          releaseBody: |
            ## OriginClean ${{ github.ref_name || 'v1.0.0' }}
            **Clean Your Files. Preserve Their Origin.**

            Developed and published by **Muhammad Lutfi Muzaki**.

            ### Supported Platforms in this Release
            - **Windows 10 / 11 (x64):** `OriginClean-Setup.exe` (NSIS) & `OriginClean.msi`
            - **macOS (Apple Silicon ARM64 & Intel x64):** `OriginClean.dmg` & `OriginClean.app`
            - **Linux (Ubuntu / Debian / Fedora):** `OriginClean.AppImage`, `OriginClean.deb`, `OriginClean.rpm`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

